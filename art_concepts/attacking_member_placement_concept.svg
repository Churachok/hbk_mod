<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7fa"/>
      <stop offset="1" stop-color="#dfe4ea"/>
    </linearGradient>
    <pattern id="whiteCeramic" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#d9d2c7"/>
      <rect width="8" height="8" fill="#e8e2d8" opacity="0.55"/>
      <rect x="8" y="8" width="8" height="8" fill="#c9c1b6" opacity="0.4"/>
    </pattern>
    <pattern id="magentaCeramic" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#945071"/>
      <rect width="8" height="8" fill="#a85d80" opacity="0.65"/>
      <rect x="8" y="8" width="8" height="8" fill="#7e3f60" opacity="0.5"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#273746"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <text x="600" y="46" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#202b33">
    Схема расположения модели при выбранном слоте
  </text>

  <!-- Front view panel -->
  <g transform="translate(35 75)">
    <rect width="535" height="570" rx="20" fill="#ffffff" opacity="0.83" stroke="#b9c1c8" stroke-width="2"/>
    <text x="267" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#34434f">ВИД СПЕРЕДИ</text>

    <ellipse cx="267" cy="527" rx="150" ry="24" fill="#65727c" opacity="0.18"/>
    <!-- Player -->
    <g filter="url(#shadow)">
      <rect x="197" y="72" width="140" height="140" fill="#d9a177" stroke="#394650" stroke-width="4"/>
      <rect x="177" y="212" width="180" height="220" fill="#426b9e" stroke="#394650" stroke-width="4"/>
      <rect x="117" y="222" width="60" height="220" fill="#d9a177" stroke="#394650" stroke-width="4"/>
      <rect x="357" y="222" width="60" height="220" fill="#d9a177" stroke="#394650" stroke-width="4"/>
      <rect x="187" y="432" width="80" height="120" fill="#3f4e65" stroke="#394650" stroke-width="4"/>
      <rect x="267" y="432" width="80" height="120" fill="#3f4e65" stroke="#394650" stroke-width="4"/>
    </g>

    <!-- Crossbar: exactly at the torso/legs seam and in front -->
    <g filter="url(#shadow)" stroke="#746f68" stroke-width="3">
      <rect x="147" y="427" width="80" height="80" fill="url(#whiteCeramic)"/>
      <!-- From the front, the forward magenta tip occludes the centre white cube. -->
      <rect x="227" y="427" width="80" height="80" fill="url(#magentaCeramic)" stroke="#693048"/>
      <rect x="307" y="427" width="80" height="80" fill="url(#whiteCeramic)"/>
    </g>
    <line x1="105" y1="432" x2="429" y2="432" stroke="#d24836" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="267" y="560" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#35434c">Перекладина — сразу после конца торса</text>
  </g>

  <!-- Side view panel -->
  <g transform="translate(630 75)">
    <rect width="535" height="570" rx="20" fill="#ffffff" opacity="0.83" stroke="#b9c1c8" stroke-width="2"/>
    <text x="267" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#34434f">ВИД СБОКУ</text>

    <ellipse cx="240" cy="527" rx="150" ry="24" fill="#65727c" opacity="0.18"/>
    <!-- Player facing right -->
    <g filter="url(#shadow)">
      <rect x="105" y="72" width="140" height="140" fill="#d9a177" stroke="#394650" stroke-width="4"/>
      <rect x="115" y="212" width="120" height="220" fill="#426b9e" stroke="#394650" stroke-width="4"/>
      <rect x="215" y="222" width="55" height="220" fill="#d9a177" stroke="#394650" stroke-width="4"/>
      <rect x="120" y="432" width="55" height="120" fill="#3f4e65" stroke="#394650" stroke-width="4"/>
      <rect x="180" y="432" width="55" height="120" fill="#3f4e65" stroke="#394650" stroke-width="4"/>
    </g>

    <!-- Side profile: center crossbar cube + two white forward + magenta tip -->
    <g filter="url(#shadow)" stroke="#746f68" stroke-width="3">
      <rect x="235" y="427" width="62" height="62" fill="url(#whiteCeramic)"/>
      <rect x="297" y="427" width="62" height="62" fill="url(#whiteCeramic)"/>
      <rect x="359" y="427" width="62" height="62" fill="url(#whiteCeramic)"/>
      <rect x="421" y="427" width="62" height="62" fill="url(#magentaCeramic)" stroke="#693048"/>
    </g>

    <line x1="225" y1="432" x2="225" y2="510" stroke="#d24836" stroke-width="3" stroke-dasharray="8 7"/>
    <line x1="250" y1="535" x2="475" y2="535" stroke="#273746" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="360" y="563" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#35434c">Направление взгляда игрока и пурпурного конца</text>
  </g>

  <text x="600" y="682" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55636d">
    5 белых блоков керамики + 1 пурпурный блок; руки игрока свободны
  </text>
</svg>
